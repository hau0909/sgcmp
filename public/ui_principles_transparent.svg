<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="1920" height="1040">
  <defs>
    <!-- Box Gradients & Shadows -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafdfa" />
    </linearGradient>

    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="greenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#55b347" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
    text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .principle-title {
      font-size: 21px;
      font-weight: 800;
      fill: #55b347;
    }
    .principle-body {
      font-size: 16.5px;
      font-weight: 500;
      fill: #2c3a2e;
    }
    .bullet-dot {
      fill: #55b347;
    }
  </style>

  <!-- Container Box (Purple / Green Accent Border) -->
  <rect x="20" y="20" width="920" height="480" rx="20" ry="20" fill="#ffffff" fill-opacity="0.95" stroke="#a7f3d0" stroke-width="2.5" filter="url(#boxShadow)"/>

  <!-- Principle 1: Navigation -->
  <g transform="translate(50, 60)">
    <circle cx="12" cy="18" r="7" class="bullet-dot" filter="url(#greenGlow)"/>
    <text x="32" y="24" class="principle-title">Navigation:</text>
    <text x="165" y="24" class="principle-body">Simple and intuitive, designed for campus coordinators, administrators,</text>
    <text x="32" y="52" class="principle-body">and security guards with easy-to-use role-based menus.</text>
  </g>

  <!-- Principle 2: Buttons -->
  <g transform="translate(50, 165)">
    <circle cx="12" cy="18" r="7" class="bullet-dot" filter="url(#greenGlow)"/>
    <text x="32" y="24" class="principle-title">Buttons:</text>
    <text x="130" y="24" class="principle-body">Clear visual hierarchy with distinct colors for key actions</text>
    <text x="32" y="52" class="principle-body">(Primary, Secondary, Destructive).</text>
  </g>

  <!-- Principle 3: Feedback -->
  <g transform="translate(50, 270)">
    <circle cx="12" cy="18" r="7" class="bullet-dot" filter="url(#greenGlow)"/>
    <text x="32" y="24" class="principle-title">Feedback:</text>
    <text x="145" y="24" class="principle-body">Instant responses with real-time toast notifications, status badges,</text>
    <text x="32" y="52" class="principle-body">and interactive feedback dialogs.</text>
  </g>

  <!-- Principle 4: Accessibility -->
  <g transform="translate(50, 375)">
    <circle cx="12" cy="18" r="7" class="bullet-dot" filter="url(#greenGlow)"/>
    <text x="32" y="24" class="principle-title">Accessibility:</text>
    <text x="180" y="24" class="principle-body">User-friendly responsive interface suitable for both tech-savvy</text>
    <text x="32" y="52" class="principle-body">coordinators and non-tech security guards across desktop &amp; mobile devices.</text>
  </g>
</svg>
